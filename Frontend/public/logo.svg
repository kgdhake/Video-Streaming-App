<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338CA" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Video Camera Body -->
  <rect x="110" y="166" width="200" height="180" rx="36" fill="url(#camGrad)" />

  <!-- Video Camera Lens Triangle / Cone -->
  <path d="M336 218 L402 172 C412 165 426 172 426 185 V327 C426 340 412 347 402 340 L336 294 V218 Z" fill="url(#camGrad)" />

  <!-- Camera Lens / Iris Circle -->
  <circle cx="210" cy="256" r="44" fill="#6366F1" />
  <circle cx="210" cy="256" r="26" fill="#4338CA" />
  <circle cx="222" cy="244" r="9" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Live Broadcast Signal Dot -->
  <circle cx="146" cy="202" r="10" fill="#EF4444" />
</svg>
